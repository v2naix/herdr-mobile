[project]
name = "herdr-mobile"
version = "0.1.0"
description = "Tailnet-only mobile control surface for herdr panes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
